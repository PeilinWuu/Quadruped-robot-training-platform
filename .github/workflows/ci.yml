name: Frontend and resource checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:go2
      - run: npm run build:go2-visuals
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
