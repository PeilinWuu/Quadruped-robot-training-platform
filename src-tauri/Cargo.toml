[package]
name = "quadruped-robot-research"
version = "0.1.0"
description = "Windows desktop shell for the Quadruped Robot Research UI"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "quadruped_robot_research_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
fs2 = "0.4.3"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
scrypt = { version = "0.12.0", features = ["getrandom", "phc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.2"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
